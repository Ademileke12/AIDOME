<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    
    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" sizes="180x180" href="/favicon.svg" />
    
    <!-- Viewport -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0" />
    
    <!-- Primary Meta Tags -->
    <title>AI Dome - Premium Design Gallery & Learning Platform</title>
    <meta name="title" content="AI Dome - Premium Design Gallery & Learning Platform" />
    <meta name="description" content="Explore curated premium web interfaces, cinematic environments, and professional design courses. Learn from industry experts and elevate your design skills." />
    <meta name="keywords" content="web design, UI design, design courses, premium templates, design learning, cinematic design, web development, design gallery" />
    <meta name="author" content="AI Dome" />
    <meta name="robots" content="index, follow" />
    <meta name="language" content="English" />
    <meta name="revisit-after" content="7 days" />
    
    <!-- Theme Color -->
    <meta name="theme-color" content="#000000" />
    <meta name="msapplication-TileColor" content="#000000" />
    
    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://aidome.com/" />
    <meta property="og:title" content="AI Dome - Premium Design Gallery & Learning Platform" />
    <meta property="og:description" content="Explore curated premium web interfaces, cinematic environments, and professional design courses. Learn from industry experts and elevate your design skills." />
    <meta property="og:image" content="https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?q=80&w=1200&auto=format&fit=crop" />
    <meta property="og:site_name" content="AI Dome" />
    <meta property="og:locale" content="en_US" />
    
    <!-- Twitter -->
    <meta property="twitter:card" content="summary_large_image" />
    <meta property="twitter:url" content="https://aidome.com/" />
    <meta property="twitter:title" content="AI Dome - Premium Design Gallery & Learning Platform" />
    <meta property="twitter:description" content="Explore curated premium web interfaces, cinematic environments, and professional design courses. Learn from industry experts and elevate your design skills." />
    <meta property="twitter:image" content="https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?q=80&w=1200&auto=format&fit=crop" />
    <meta property="twitter:site" content="@aidome" />
    <meta property="twitter:creator" content="@aidome" />
    
    <!-- Canonical URL -->
    <link rel="canonical" href="https://aidome.com/" />
    
    <!-- Preconnect to external domains for performance -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://images.unsplash.com" />
    
    <!-- DNS Prefetch -->
    <link rel="dns-prefetch" href="https://fonts.googleapis.com" />
    <link rel="dns-prefetch" href="https://images.unsplash.com" />
    
    <!-- Structured Data -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebSite",
      "name": "AI Dome",
      "url": "https://aidome.com",
      "description": "Premium design gallery and learning platform for web designers and developers",
      "potentialAction": {
        "@type": "SearchAction",
        "target": {
          "@type": "EntryPoint",
          "urlTemplate": "https://aidome.com/search?q={search_term_string}"
        },
        "query-input": "required name=search_term_string"
      }
    }
    </script>
    
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Organization",
      "name": "AI Dome",
      "url": "https://aidome.com",
      "logo": "https://aidome.com/favicon.svg",
      "description": "Premium design gallery and learning platform",
      "sameAs": [
        "https://twitter.com/aidome",
        "https://linkedin.com/company/aidome"
      ]
    }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
